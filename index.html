<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand - Inicio</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Brand</a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link active fw-medium text-dark" aria-current="page" href="#">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-muted" href="#">Productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-muted" href="#">Nosotros</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <a href="#" class="text-dark position-relative fs-5" id="cart-icon">
                        <i class="bi bi-cart3"></i>
                        <span id="cart-badge" class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle d-none">
                            <span class="visually-hidden">New alerts</span>
                        </span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container content-wrapper">
        <!-- Hero Section -->
        <section class="hero-section row align-items-center mb-5 rounded-4 p-4 p-md-5">
            <div class="col-md-6 order-2 order-md-1">
                <h1 class="display-4 fw-bold mb-3 text-dark">Encuentra lo que necesitas</h1>
                <p class="lead text-muted mb-4 fs-6">Productos de calidad al mejor precio.</p>
                <button class="btn btn-primary px-4 py-2 rounded-3 fw-medium">Ver productos</button>
            </div>
            <div class="col-md-6 order-1 order-md-2 text-center mb-4 mb-md-0">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&q=80&w=400" alt="Audífonos" class="img-fluid hero-image rounded-4 shadow-sm">
            </div>
        </section>

        <!-- Info Blocks Section -->
        <section class="info-blocks mb-5 row g-4 text-center text-md-start">
            <div class="col-md-4">
                <div class="d-flex flex-column flex-md-row align-items-center align-items-md-start gap-3">
                    <div class="icon-box text-primary fs-4">
                        <i class="bi bi-truck"></i>
                    </div>
                    <div>
                        <h6 class="fw-bold mb-1">Envío gratis</h6>
                        <p class="text-muted small mb-0">En pedidos +$50</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="d-flex flex-column flex-md-row align-items-center align-items-md-start gap-3">
                    <div class="icon-box text-primary fs-4">
                        <i class="bi bi-shield-check"></i>
                    </div>
                    <div>
                        <h6 class="fw-bold mb-1">Garantía</h6>
                        <p class="text-muted small mb-0">30 días</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="d-flex flex-column flex-md-row align-items-center align-items-md-start gap-3">
                    <div class="icon-box text-primary fs-4">
                        <i class="bi bi-headset"></i>
                    </div>
                    <div>
                        <h6 class="fw-bold mb-1">Soporte</h6>
                        <p class="text-muted small mb-0">24/7</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Categorías Populares Section -->
        <section class="categories mb-5">
            <h5 class="fw-bold mb-4">Categorías populares</h5>
            <div class="row g-4">
                <div class="col-4 col-md-4">
                    <div class="card border-0 h-100 category-card cursor-pointer">
                        <div class="card-img-wrapper rounded-3 overflow-hidden bg-light mb-2">
                            <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&q=80&w=300" class="img-fluid object-fit-cover w-100 h-100" alt="Tecnología">
                        </div>
                        <h6 class="text-center fw-medium small mb-0">Tecnología</h6>
                    </div>
                </div>
                <div class="col-4 col-md-4">
                    <div class="card border-0 h-100 category-card cursor-pointer">
                        <div class="card-img-wrapper rounded-3 overflow-hidden bg-light mb-2">
                            <img src="https://images.unsplash.com/photo-1493663284031-b7e3aefcae8e?auto=format&fit=crop&q=80&w=300" class="img-fluid object-fit-cover w-100 h-100" alt="Hogar">
                        </div>
                        <h6 class="text-center fw-medium small mb-0">Hogar</h6>
                    </div>
                </div>
                <div class="col-4 col-md-4">
                    <div class="card border-0 h-100 category-card cursor-pointer">
                        <div class="card-img-wrapper rounded-3 overflow-hidden bg-light mb-2">
                            <img src="https://images.unsplash.com/photo-1523206489230-c012c64b2b48?auto=format&fit=crop&q=80&w=300" class="img-fluid object-fit-cover w-100 h-100" alt="Accesorios">
                        </div>
                        <h6 class="text-center fw-medium small mb-0">Accesorios</h6>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="assets/js/main.js"></script>
</body>
</html>
