<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand - Productos</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Brand</a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link text-muted" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active fw-medium text-dark" aria-current="page"
                            href="productos.html">Productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-muted" href="#">Nosotros</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <a href="#" class="text-dark position-relative fs-5" id="cart-icon">
                        <i class="bi bi-cart3"></i>
                        <span id="cart-badge"
                            class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle d-none">
                            <span class="visually-hidden">New alerts</span>
                        </span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container content-wrapper mb-5">
        <h2 class="fw-bold mb-4">Nuestros productos</h2>

        <!-- Search and Filter -->
        <div class="row mb-4">
            <div class="col-12 col-md-8 mb-3 mb-md-0 d-flex gap-2">
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0">
                        <i class="bi bi-search text-muted"></i>
                    </span>
                    <input type="text" class="form-control border-start-0 ps-0 shadow-none"
                        placeholder="Buscar productos...">
                </div>
                <button class="btn btn-light border px-4 fw-medium text-nowrap">Filtrar</button>
            </div>
        </div>

        <!-- Products Grid -->
        <div class="row g-4">
            <!-- Product 1 -->
            <div class="col-12 col-md-6 col-lg-3">
                <div class="card h-100 border-0 shadow-sm p-3 rounded-4 cursor-pointer product-card">
                    <div class="bg-light rounded-3 d-flex align-items-center justify-content-center p-4 mb-3"
                        style="aspect-ratio: 1/1;">
                        <img src="assets/img/audifonos.jpg"
                            class="img-fluid w-100 h-100 object-fit-contain mix-blend-multiply" alt="Audífonos Inalámbricos">
                    </div>
                    <div>
                        <h6 class="fw-bold mb-1">Audífonos Inalámbricos</h6>
                        <p class="fw-bold fs-5 mb-2">$59.99</p>
                        <div class="text-warning small mb-3">
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star-fill"></i>
                        </div>
                        <button class="btn btn-primary w-100 rounded-3 add-to-cart-btn">Agregar al carrito</button>
                    </div>
                </div>
            </div>

            <!-- Product 2 -->
            <div class="col-12 col-md-6 col-lg-3">
                <div class="card h-100 border-0 shadow-sm p-3 rounded-4 cursor-pointer product-card">
                    <div class="bg-light rounded-3 d-flex align-items-center justify-content-center p-4 mb-3"
                        style="aspect-ratio: 1/1;">
                        <img src="assets/img/reloj inteligente.jpg"
                            class="img-fluid w-100 h-100 object-fit-contain mix-blend-multiply" alt="Smartwatch Pro">
                    </div>
                    <div>
                        <h6 class="fw-bold mb-1">Smartwatch Pro</h6>
                        <p class="fw-bold fs-5 mb-2">$89.99</p>
                        <div class="text-warning small mb-3">
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star"></i>
                        </div>
                        <button class="btn btn-primary w-100 rounded-3 add-to-cart-btn">Agregar al carrito</button>
                    </div>
                </div>
            </div>

            <!-- Product 3 -->
            <div class="col-12 col-md-6 col-lg-3">
                <div class="card h-100 border-0 shadow-sm p-3 rounded-4 cursor-pointer product-card">
                    <div class="bg-light rounded-3 d-flex align-items-center justify-content-center p-4 mb-3"
                        style="aspect-ratio: 1/1;">
                        <img src="assets/img/camara.jpg"
                            class="img-fluid w-100 h-100 object-fit-contain mix-blend-multiply" alt="Cámara Digital">
                    </div>
                    <div>
                        <h6 class="fw-bold mb-1">Cámara Digital</h6>
                        <p class="fw-bold fs-5 mb-2">$199.99</p>
                        <div class="text-warning small mb-3">
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star-fill"></i>
                        </div>
                        <button class="btn btn-primary w-100 rounded-3 add-to-cart-btn">Agregar al carrito</button>
                    </div>
                </div>
            </div>

            <!-- Product 4 -->
            <div class="col-12 col-md-6 col-lg-3">
                <div class="card h-100 border-0 shadow-sm p-3 rounded-4 cursor-pointer product-card">
                    <div class="bg-light rounded-3 d-flex align-items-center justify-content-center p-4 mb-3"
                        style="aspect-ratio: 1/1;">
                        <img src="assets/img/mochila.jpg"
                            class="img-fluid w-100 h-100 object-fit-contain mix-blend-multiply" alt="Mochila Urbana">
                    </div>
                    <div>
                        <h6 class="fw-bold mb-1">Mochila Urbana</h6>
                        <p class="fw-bold fs-5 mb-2">$39.99</p>
                        <div class="text-warning small mb-3">
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star"></i>
                        </div>
                        <button class="btn btn-primary w-100 rounded-3 add-to-cart-btn">Agregar al carrito</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pagination -->
        <div class="d-flex justify-content-center mt-5">
            <nav aria-label="Navegación de páginas">
                <ul class="pagination gap-2 border-0">
                    <li class="page-item active"><a class="page-link rounded-3 border-0" href="#">1</a></li>
                    <li class="page-item"><a class="page-link rounded-3 border-0 bg-light text-dark" href="#">2</a></li>
                    <li class="page-item"><a class="page-link rounded-3 border-0 bg-light text-dark" href="#">3</a></li>
                </ul>
            </nav>
        </div>
    </main>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="assets/js/main.js"></script>
</body>

</html>
